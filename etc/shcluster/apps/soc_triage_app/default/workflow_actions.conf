# Workflow action: right-click any notable event and jump to the triage detail view.
# Works in ES incident review and any search against index=notable.

[soc_open_triage_detail]
display_location = both
eventtypes =
fields = orig_sid,rule_id,alert_id
label = SOC: Open Triage Detail
link.method = get
link.target = _blank
link.uri = /app/soc_triage_app/alert_detail?form.alert_id=$orig_sid$
show_as = link
type = link
