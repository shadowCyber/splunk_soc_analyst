# Cyber Defense Triage App roles
# Deploy via SHC bundle; these extend built-in Splunk roles.

[role_soc_tier1]
# Tier 1 — Alert intake, initial triage, assign, escalate to T2
# Can view T1 queue, update status/owner/notes, cannot suppress globally
importRoles = user
srchIndexesAllowed = notable, main, risk, *
srchIndexesDefault = notable
srchMaxTime = 120
rtSrchJobsQuota = 4
srchJobsQuota = 8

[role_soc_tier2]
# Tier 2 — Deep investigation, enrichment, containment, escalate to T3
# Inherits T1; can view T1+T2 queues, broader index access
importRoles = soc_tier1
srchIndexesAllowed = notable, main, risk, threatlists, endpoint, network, *
srchIndexesDefault = notable
srchMaxTime = 240
rtSrchJobsQuota = 8
srchJobsQuota = 16

[role_soc_tier3]
# Tier 3 — Threat hunting, rule tuning, suppression management
# Inherits T2 + power; can suppress, bulk-close, manage all KV collections
importRoles = soc_tier2, power
srchIndexesAllowed = *
srchIndexesDefault = notable
srchMaxTime = 600
rtSrchJobsQuota = 12
srchJobsQuota = 30

[role_soc_lead]
# SOC Lead — admin-level oversight across all tiers
importRoles = soc_tier3, power
srchIndexesAllowed = *
srchIndexesDefault = notable
srchMaxTime = 600
rtSrchJobsQuota = 16
srchJobsQuota = 40
