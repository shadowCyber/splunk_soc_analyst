[SOC - New High Risk Alerts]
description = Shows high-risk open alerts for analyst intake.
search = `soc_alerts_normalized` | where status!="closed" | eval risk_score=tonumber(risk_score) | where risk_score>=70 | sort - risk_score
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
is_visible = 1

[SOC - Stale Unassigned Alerts]
description = Alerts with no owner older than 60 minutes.
search = `soc_alerts_normalized` | where status!="closed" AND (isnull(owner) OR owner="") | eval age_min=round((now()-strptime(created_at, "%Y-%m-%dT%H:%M:%SZ"))/60,0) | where age_min>=60 | sort - age_min
cron_schedule = */15 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
is_visible = 1

[SOC - SLA Breach Alerts]
description = Alerts that breached triage SLA.
search = `soc_alerts_normalized` | where status!="closed" | eval sla_due_epoch=strptime(sla_due, "%Y-%m-%dT%H:%M:%SZ") | where now()>sla_due_epoch | eval sla_breached=1 | sort - risk_score
cron_schedule = */10 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
is_visible = 1
[SOC - Auto-Close Suppressed Alerts]
description = Auto-closes KV triage records that match an active non-expired suppression rule.
search = `soc_alerts_normalized` | where status!="closed" | lookup soc_suppression_list rule_name OUTPUT entity_pattern as sup_entity, suppress_type, reason, expiry, active | where active="true" | eval expiry_epoch=strptime(expiry,"%Y-%m-%dT%H:%M:%SZ") | where now()<expiry_epoch | eval entity_match=if(sup_entity="*" OR match(entity,sup_entity),"yes","no") | where entity_match="yes" | eval status="closed", notes="Auto-suppressed: ".reason, last_updated=strftime(now(),"%Y-%m-%dT%H:%M:%SZ") | table alert_id status notes last_updated | outputlookup append=false key_field=alert_id soc_alert_triage
cron_schedule = */10 * * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
enabledSched = 1
is_visible = 1

[SOC - Analyst Shift Summary Report]
description = Hourly snapshot of analyst triage metrics for shift handoff.
search = `soc_alerts_normalized` | stats dc(eval(status!="closed")) as open dc(eval(status="closed")) as closed avg(risk_score) as avg_risk by owner | eval avg_risk=round(avg_risk,1) | sort - closed
cron_schedule = 0 * * * *
dispatch.earliest_time = -8h
dispatch.latest_time = now
enabledSched = 1
is_visible = 1
[SOC - Sync Analyst Roster from LDAP]
description = Syncs SOC users into soc_analyst_roster KV every 30 min. When LDAP is configured, maps LDAP group members automatically via Splunk role mapping.
search = | rest /services/authentication/users splunk_server=local | eval roles_str=mvjoin(roles,",") | where match(roles_str,"soc_|admin") | eval username=name, display_name=coalesce(realname,name), email=coalesce(email,""), splunk_role=roles_str, tier=case(match(roles_str,"soc_tier3"),"T3 - Hunt/Tune",match(roles_str,"soc_tier2"),"T2 - Investigate",match(roles_str,"soc_lead"),"Lead",match(roles_str,"admin"),"Admin",true(),"T1 - Intake"), active="true", last_synced=strftime(now(),"%Y-%m-%dT%H:%M:%SZ") | table username display_name email splunk_role tier active last_synced | outputlookup soc_analyst_roster
cron_schedule = */30 * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
enableSched = 1
is_visible = 1
